name: Copilot

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'renovate[bot]' }}
    permissions:
      copilot-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up project
        uses: ApiTreeCZ/github-actions/.github/actions/setup-project@v0.6.1
        with:
          op-service-account-token: ${{ secrets.OP_APITREE_INFRA_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets
        id: load-secrets
        uses: ApiTreeCZ/github-actions/.github/actions/load-secrets@v0.6.1
        with:
          op-service-account-token: ${{ secrets.OP_APITREE_INFRA_SERVICE_ACCOUNT_TOKEN }}
          secrets: |
            COPILOT_ACCESS_TOKEN=op://apitree-infra/github-actions/COPILOT_ACCESS_TOKEN

      - name: Parse secrets
        id: parse-secrets
        uses: ApiTreeCZ/github-actions/.github/actions/json-to-outputs@v0.6.1
        with:
          json: ${{ steps.load-secrets.outputs.secrets }}

      - name: Authenticate with GitHub CLI
        run: |
          echo "${{ steps.parse-secrets.outputs.COPILOT_ACCESS_TOKEN }}" | gh auth login --with-token

      - name: Prompt Copilot to auto-approve the PR
        id: copilot
        uses: ApiTreeCZ/github-actions/.github/actions/copilot@main
        env:
          COPILOT_REVIEW_RESULT: '${{ github.workspace }}/temp/copilot_review_result.json'
        with:
          args: "--allow-tool='shell(gh:*)' --allow-tool='shell(git:*)' --allow-tool='write'"
          prompt: |
            You are Renovate bot Copilot that can analyze pull requests and determine if they can be auto-approved.
            The pull request no. ${{ github.event.pull_request.number }} is created by the Renovate bot and contains automated dependency updates.
            Use `gh` and `git` CLI to to analyze the PR and approve it if all the following conditions are met:
            - The PR contains only dependency updates (no other code changes).
            - All required CI checks have passed.
            If the PR meets the conditions, approve it via `gh` CLI. Do nothing if it does not meet the conditions.
